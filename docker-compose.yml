# Perfiles: dev, staging, prod. Ejecuta uno con:
#   docker compose --profile dev up --build
#   docker compose --profile staging up --build -d
#   docker compose --profile prod up --build -d
#
# network_mode: host es imprescindible para que el broadcast UDP de Wake-on-LAN
# y el ping ICMP salgan a la LAN real. Requiere un host Linux (en Docker Desktop
# de Windows/Mac la red host es limitada). Con red host, el mapeo de puertos se
# ignora: la app escucha directamente en el PORT indicado del host.

services:
    dev:
        profiles: ['dev']
        build:
            context: .
            target: dev
        network_mode: host
        environment:
            - DATA_FILE=/data/devices.json
        volumes:
            - .:/app
            - /app/node_modules
            - wol-data-dev:/data

    staging:
        profiles: ['staging']
        build:
            context: .
            target: runtime
        network_mode: host
        environment:
            - NODE_ENV=production
            - PORT=4322
            - DATA_FILE=/data/devices.json
        volumes:
            - wol-data-staging:/data
        restart: unless-stopped

    prod:
        profiles: ['prod']
        build:
            context: .
            target: runtime
        network_mode: host
        environment:
            - NODE_ENV=production
            - PORT=4321
            - DATA_FILE=/data/devices.json
        volumes:
            - wol-data-prod:/data
        restart: unless-stopped

volumes:
    wol-data-dev:
    wol-data-staging:
    wol-data-prod:
